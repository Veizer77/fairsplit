<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#0B0F17" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.2" fill="none" />

  <!-- Receipt Icon -->
  <g filter="url(#glow)">
    <path d="M140 100 H372 V412 L333 388 L294 412 L256 388 L218 412 L179 388 L140 412 Z" fill="#131B26" stroke="#10b981" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Receipt Lines -->
    <rect x="180" y="170" width="152" height="16" rx="8" fill="#10b981" />
    <rect x="180" y="215" width="100" height="14" rx="7" fill="#64748b" />
    <rect x="180" y="255" width="120" height="14" rx="7" fill="#64748b" />
    <rect x="180" y="295" width="152" height="16" rx="8" fill="#10b981" fill-opacity="0.8" />

    <!-- Division / Split Sparkle Symbol -->
    <circle cx="340" cy="245" r="14" fill="#38bdf8" />
    <circle cx="340" cy="295" r="14" fill="#38bdf8" />
    <rect x="320" y="266" width="40" height="8" rx="4" fill="#38bdf8" />
  </g>
</svg>
